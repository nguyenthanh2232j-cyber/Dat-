<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE STORE - Cửa Hàng Cao Cấp</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5a4bd1;
            --secondary: #00cec9;
            --accent: #fd79a8;
            --gold: #fdcb6e;
            --dark: #2d3436;
            --light: #f8f9fa;
            --success: #00b894;
            --danger: #d63031;
            --warning: #e17055;
            --shadow: 0 10px 40px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a3e 25%, #2d1b4e 50%, #1a1a3e 75%, #0c0c1d 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(108,92,231,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(253,121,168,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(0,206,201,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 20px; }

        /* HEADER */
        .header {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 0;
        }
        .header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--secondary), var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }
        .nav-links { display: flex; gap: 25px; list-style: none; flex-wrap: wrap; }
        .nav-links a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
            padding: 5px 0;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 2px;
            background: var(--secondary);
            transition: var(--transition);
            border-radius: 2px;
        }
        .nav-links a:hover { color: #fff; }
        .nav-links a:hover::after { width: 100%; }
        .nav-links a.active { color: var(--secondary); }
        .nav-links a.active::after { width: 100%; background: var(--secondary); }

        .header-actions { display: flex; gap: 12px; align-items: center; }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 4px 15px rgba(108,92,231,0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108,92,231,0.6);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
        }
        .btn-outline:hover {
            border-color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .btn-accent {
            background: linear-gradient(135deg, var(--accent), #e84393);
            color: #fff;
            box-shadow: 0 4px 15px rgba(253,121,168,0.4);
        }
        .btn-accent:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(253,121,168,0.6);
        }
        .btn-success {
            background: linear-gradient(135deg, var(--success), #00a884);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,184,148,0.4);
        }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn-lg { padding: 14px 32px; font-size: 16px; }
        .cart-count {
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            width: 22px; height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        /* SECTIONS */
        .section { padding: 60px 0; }
        .section-title {
            font-size: 36px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, rgba(255,255,255,0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-subtitle {
            text-align: center;
            color: rgba(255,255,255,0.6);
            margin-bottom: 40px;
            font-size: 16px;
        }

        /* HERO */
        .hero {
            text-align: center;
            padding: 100px 0 80px;
            position: relative;
        }
        .hero h1 {
            font-size: 56px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, var(--secondary) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }

        /* PRODUCT GRID */
        .filter-bar {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .filter-btn {
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(255,255,255,0.2);
        }
        .product-badge {
            position: absolute;
            top: 15px; left: 15px;
            background: var(--accent);
            color: #fff;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            z-index: 2;
        }
        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: linear-gradient(135deg, rgba(108,92,231,0.3), rgba(253,121,168,0.3));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .product-info { padding: 20px; }
        .product-category {
            font-size: 12px;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .product-name { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .product-price {
            font-size: 22px;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 15px;
        }
        .product-price .old-price {
            text-decoration: line-through;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            margin-left: 8px;
            font-weight: 400;
        }
        .product-actions { display: flex; gap: 8px; }

        /* CART SIDEBAR */
        .cart-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            display: none;
            backdrop-filter: blur(5px);
        }
        .cart-overlay.open { display: block; }
        .cart-sidebar {
            position: fixed;
            top: 0; right: -420px;
            width: 400px;
            max-width: 95vw;
            height: 100vh;
            background: #1a1a3e;
            z-index: 201;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255,255,255,0.1);
            box-shadow: -10px 0 40px rgba(0,0,0,0.3);
        }
        .cart-sidebar.open { right: 0; }
        .cart-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-header h3 { font-size: 20px; font-weight: 700; }
        .cart-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }
        .cart-close:hover { color: var(--accent); }
        .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
        .cart-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            align-items: center;
        }
        .cart-item-img {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, rgba(108,92,231,0.3), rgba(253,121,168,0.3));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            flex-shrink: 0;
        }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; font-size: 14px; }
        .cart-item-price { color: var(--gold); font-weight: 700; font-size: 13px; }
        .cart-item-qty { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .qty-btn {
            width: 25px; height: 25px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
        }
        .qty-btn:hover { background: var(--primary); border-color: var(--primary); }
        .cart-item-remove {
            color: var(--danger);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            transition: var(--transition);
        }
        .cart-item-remove:hover { transform: scale(1.2); }
        .cart-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .cart-total { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px; font-weight: 700; }
        .cart-total .amount { color: var(--gold); }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #1a1a3e;
            border-radius: var(--radius);
            padding: 30px;
            width: 450px;
            max-width: 95vw;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: var(--shadow-lg);
        }
        .modal h3 { font-size: 24px; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; color: rgba(255,255,255,0.8); font-weight: 500; font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 15px;
            transition: var(--transition);
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108,92,231,0.2);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }

        /* ADMIN PANEL */
        .admin-panel {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius);
            padding: 30px;
            margin-top: 30px;
        }
        .admin-tabs { display: flex; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .admin-tab {
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }
        .admin-tab:hover, .admin-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .admin-content { display: none; }
        .admin-content.active { display: block; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
        }
        .stat-value { font-size: 32px; font-weight: 800; color: var(--gold); }
        .stat-label { color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 5px; }
        .order-list, .product-admin-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .order-item, .product-admin-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: var(--radius-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 14px 20px;
            background: #1a1a3e;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: var(--radius-sm);
            color: #fff;
            animation: slideIn 0.3s ease;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            min-width: 250px;
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* CHECKOUT STEPS */
        .checkout-steps { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .checkout-step {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.3);
            font-weight: 700;
            transition: var(--transition);
        }
        .checkout-step.active { background: var(--primary); border-color: var(--primary); }
        .checkout-step.done { background: var(--success); border-color: var(--success); }

        @media (max-width: 768px) {
            .hero h1 { font-size: 32px; }
            .section-title { font-size: 26px; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
            .cart-sidebar { width: 100%; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="particles" id="particles"></div>

<!-- HEADER -->
<header class="header">
    <div class="container">
        <div class="logo">✦ LUXE STORE</div>
        <ul class="nav-links">
            <li><a href="#home" class="active" onclick="showSection('home')">Trang Chủ</a></li>
            <li><a href="#shop" onclick="showSection('shop')">Cửa Hàng</a></li>
            <li><a href="#about" onclick="showSection('about')">Về Chúng Tôi</a></li>
            <li><a href="#admin" onclick="showSection('admin')">Admin</a></li>
        </ul>
        <div class="header-actions">
            <button class="btn btn-outline btn-sm" onclick="openModal('loginModal')">Đăng Nhập</button>
            <button class="btn btn-outline btn-sm" onclick="openCart()">
                🛒 Giỏ Hàng <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </div>
</header>

<!-- MAIN CONTENT -->
<div class="container">

    <!-- HOME SECTION -->
    <section
