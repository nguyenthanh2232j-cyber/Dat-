<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập | GameShop</title>
  <!-- Font Awesome cho icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ========== RESET & FONT ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
      background-image: radial-gradient(circle at 20% 30%, #1a2634 0%, #0b0e14 80%);
      padding: 20px;
    }

    /* ========== CONTAINER CHÍNH ========== */
    .login-container {
      background: #141b24;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px 36px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
      transition: 0.25s ease;
    }

    /* ========== HEADER / LOGO ========== */
    .shop-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      color: #b7c9d9;
    }

    .shop-header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .shop-header .logo i {
      color: #f7c948;
      font-size: 26px;
    }

    .shop-header .badge {
      background: #f7c948;
      color: #0b0e14;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* ========== TIÊU ĐỀ FORM ========== */
    .form-title {
      margin-bottom: 28px;
    }

    .form-title h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .form-title p {
      color: #8899aa;
      font-size: 15px;
      margin-top: 6px;
    }

    /* ========== FORM ========== */
    .login-form .input-group {
      margin-bottom: 18px;
      position: relative;
    }

    .login-form .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #c8d6e5;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .login-form .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: #1f2a35;
      border: 1px solid #2a3a48;
      border-radius: 14px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: 0.2s ease;
    }

    .login-form .input-group input:focus {
      border-color: #f7c948;
      box-shadow: 0 0 0 3px rgba(247, 201, 72, 0.15);
      background: #1f2a35;
    }

    .login-form .input-group input::placeholder {
      color: #5f7387;
      font-weight: 400;
      font-size: 14px;
    }

    /* ========== TÙY CHỌN ========== */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0 26px;
      font-size: 14px;
      color: #b0c4d8;
    }

    .form-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .form-options label input[type="checkbox"] {
      accent-color: #f7c948;
      width: 17px;
      height: 17px;
      cursor: pointer;
    }

    .form-options a {
      color: #f7c948;
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
    }

    .form-options a:hover {
      color: #ffda6b;
      text-decoration: underline;
    }

    /* ========== NÚT ĐĂNG NHẬP ========== */
    .btn-login {
      width: 100%;
      padding: 15px;
      background: #f7c948;
      border: none;
      border-radius: 40px;
      font-size: 17px;
      font-weight: 700;
      color: #0b0e14;
      cursor: pointer;
      transition: 0.2s ease;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-login:hover {
      background: #ffd95e;
      transform: scale(1.01);
      box-shadow: 0 8px 28px rgba(247, 201, 72, 0.25);
    }

    .btn-login:active {
      transform: scale(0.97);
    }

    /* ========== HOẶC ========== */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 26px 0 22px;
      color: #4f6479;
      font-size: 13px;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a3a48;
    }

    /* ========== ĐĂNG KÝ ========== */
    .register-link {
      text-align: center;
      color: #b0c4d8;
      font-size: 15px;
    }

    .register-link a {
      color: #f7c948;
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
      transition: 0.2s;
    }

    .register-link a:hover {
      color: #ffda6b;
      text-decoration: underline;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 460px) {
      .login-container {
        padding: 28px 18px 28px;
      }

      .form-title h1 {
        font-size: 22px;
      }

      .shop-header .logo {
        font-size: 18px;
      }

      .shop-header .badge {
        font-size: 10px;
        padding: 3px 10px;
      }

      .form-options {
        flex-wrap: wrap;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">

    <!-- HEADER: Logo + Badge -->
    <div class="shop-header">
      <div class="logo">
        <i class="fas fa-store-alt"></i>
        <span>GameShop</span>
      </div>
      <span class="badge"><i class="fas fa-gamepad"></i> VIP</span>
    </div>

    <!-- TIÊU ĐỀ -->
    <div class="form-title">
      <h1>Đăng Nhập</h1>
      <p>Chào mừng bạn quay lại!</p>
    </div>

    <!-- FORM -->
    <form class="login-form" id="loginForm">
      <div class="input-group">
        <label for="username">Tên đăng nhập / Email</label>
        <input type="text" id="username" placeholder="Nhập tên hoặc email" required>
      </div>

      <div class="input-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <!-- Tùy chọn -->
      <div class="form-options">
        <label>
          <input type="checkbox" checked> Nhớ tài khoản
        </label>
        <a href="#">Quên mật khẩu?</a>
      </div>

      <!-- Nút đăng nhập -->
      <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt"></i> Đăng Nhập
      </button>
    </form>

    <!-- HOẶC -->
    <div class="divider">hoặc</div>

    <!-- ĐĂNG KÝ -->
    <div class="register-link">
      Chưa có tài khoản?
      <a href="#">Đăng ký ngay</a>
    </div>

  </div>

  <script>
    // Xử lý sự kiện submit form (hiển thị thông báo demo)
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        alert('⚠️ Vui lòng điền đầy đủ tên đăng nhập và mật khẩu.');
        return;
      }

      // Giả lập đăng nhập thành công
      alert(`✅ Đăng nhập thành công!\nChào mừng ${username} quay lại!`);
      // Ở đây bạn có thể chuyển hướng hoặc gửi dữ liệu lên server
      // window.location.href = '/dashboard';
    });

    // (Tùy chọn) hiệu ứng focus cho input
    document.querySelectorAll('.input-group input').forEach(input => {
      input.addEventListener('focus', function() {
        this.closest('.input-group').style.transform = 'scale(1.01)';
      });
      input.addEventListener('blur', function() {
        this.closest('.input-group').style.transform = 'scale(1)';
      });
    });
  </script>
</body>
      </html>
