<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa Hàng Trực Tuyến</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f4f9; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; background: #333; color: #fff; padding: 15px 20px; border-radius: 8px; }
    header button { background: #ff4757; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; }
    
    /* Danh sách sản phẩm */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .product-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; padding: 15px; text-align: center; }
    .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
    .product-card h3 { font-size: 1.1rem; margin: 10px 0; }
    .product-card .price { color: #e67e22; font-weight: bold; margin-bottom: 10px; }
    .product-card button { background: #2ed573; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; }

    /* Admin Panel Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 25px; border-radius: 8px; width: 400px; max-width: 90%; }
    .modal-content h2 { margin-bottom: 15px; }
    .modal-content input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .modal-content button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-submit { background: #1e90ff; color: white; }
    .btn-close { background: #747d8c; color: white; margin-left: 5px; }
  </style>
</head>
<body>

  <header>
    <h1>Cửa Hàng Trực Tuyến</h1>
    <button onclick="openAdmin()">Quản lý Shop (Admin)</button>
  </header>

  <main>
    <div id="product-list" class="product-grid">
      <!-- Sản phẩm sẽ hiển thị tại đây -->
    </div>
  </main>

  <!-- Modal Đăng nhập / Quản lý Admin -->
  <div id="admin-modal" class="modal">
    <div class="modal-content">
      <div id="login-form">
        <h2>Đăng Nhập Admin</h2>
        <input type="password" id="admin-pass" placeholder="Nhập mật khẩu admin...">
        <button class="btn-submit" onclick="loginAdmin()">Đăng Nhập</button>
        <button class="btn-close" onclick="closeAdmin()">Đóng</button>
      </div>

      <div id="admin-panel" style="display: none;">
        <h2>Thêm Sản Phẩm Mới</h2>
        <input type="text" id="prod-title" placeholder="Tên sản phẩm">
        <input type="text" id="prod-price" placeholder="Giá (VD: 150.000 VNĐ)">
        <input type="text" id="prod-img" placeholder="URL hình ảnh">
        <button class="btn-submit" onclick="addProduct()">Thêm Sản Phẩm</button>
        <button class="btn-close" onclick="logoutAdmin()">Thoát Admin</button>
      </div>
    </div>
  </div>

  <script>
    // Dữ liệu ban đầu
    const defaultProducts = [
      { id: 1, title: "Sản phẩm mẫu 1", price: "100.000 VNĐ", img: "https://via.placeholder.com/200" },
      { id: 2, title: "Sản phẩm mẫu 2", price: "200.000 VNĐ", img: "https://via.placeholder.com/200" }
    ];

    // Khởi tạo dữ liệu từ LocalStorage
    function getProducts() {
      const stored = localStorage.getItem('shop_products');
      return stored ? JSON.parse(stored) : defaultProducts;
    }

    function renderProducts() {
      const products = getProducts();
      const container = document.getElementById('product-list');
      container.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.img}" alt="${p.title}">
          <h3>${p.title}</h3>
          <div class="price">${p.price}</div>
          <button onclick="buyProduct('${p.title}')">Mua Hàng</button>
        </div>
      `).join('');
    }

    // Quản lý Modal & Admin
    function openAdmin() {
      document.getElementById('admin-modal').style.display = 'flex';
    }

    function closeAdmin() {
      document.getElementById('admin-modal').style.display = 'none';
    }

    function loginAdmin() {
      const passInput = document.getElementById('admin-pass').value;
      if (passInput === "20122014") {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('admin-pass').value = '';
      } else {
        alert("Mật khẩu không đúng!");
      }
    }

    function logoutAdmin() {
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('admin-panel').style.display = 'none';
      closeAdmin();
    }

    function addProduct() {
      const title = document.getElementById('prod-title').value;
      const price = document.getElementById('prod-price').value;
      const img = document.getElementById('prod-img').value || "https://via.placeholder.com/200";

      if (!title || !price) {
        alert("Vui lòng điền tên và giá sản phẩm!");
        return;
      }

      const products = getProducts();
      products.push({ id: Date.now(), title, price, img });
      localStorage.setItem('shop_products', JSON.stringify(products));

      // Reset form & render lại
      document.getElementById('prod-title').value = '';
      document.getElementById('prod-price').value = '';
      document.getElementById('prod-img').value = '';
      renderProducts();
      alert("Đã thêm sản phẩm thành công!");
    }

    function buyProduct(name) {
      alert(`Cảm ơn bạn đã chọn mua: ${name}!`);
    }

    // Tải sản phẩm khi vào trang
    renderProducts();
  </script>
</body>
</html>
